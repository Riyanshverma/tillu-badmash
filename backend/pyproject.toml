[project]
name = "gridbricks-backend"
version = "0.1.0"
description = "Decision-time Elexon wind analytics API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.28,<1",
    "aiosqlite>=0.20,<1",
    "numpy>=2,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
